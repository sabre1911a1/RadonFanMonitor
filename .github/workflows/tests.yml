name: Firmware logic tests
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q CIRCUITPY
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Mocked firmware startup smoke test
        run: python tests/smoke_firmware_mock.py
